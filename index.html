<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🤎%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Vazzy × Pikobuy</title>
<style id="css">
  :root {
    --bg: #E8D5BA;
    --ink: #3B2A1D;
    --muted: #6B5745;
    --glass-bg: linear-gradient(135deg, rgba(255,255,255,.44), rgba(255,255,255,.14));
    --glass-strong: linear-gradient(135deg, rgba(255,255,255,.62), rgba(255,255,255,.22));
    --tile-bg: linear-gradient(160deg, rgba(255,255,255,.62), rgba(255,255,255,.18));
    --field-bg: rgba(255,255,255,.6);
    --rim-hi: rgba(255,255,255,.85);
    --rim-lo: rgba(255,255,255,.22);
    --shadow: rgba(92,58,28,.42);
    --btn-top: #5B4231;
    --btn-bottom: #3B2A1D;
    --btn-ink: #FBF1E1;
    --seg-active: rgba(255,255,255,.82);
    --heart: #B5462F;
    --danger: #A33A26;
    --focus: #2F5FD0;
    --blob1: #C89968;
    --blob2: #E9CFA6;
    --blob3: #D8A78C;
    --blob4: #A97A52;
    --blob-opacity: .85;
    --backdrop: rgba(59,42,29,.28);
    --display: "Unbounded", "Trebuchet MS", "Segoe UI", sans-serif;
    --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1D140E;
      --ink: #F5E8D5;
      --muted: #BFA88E;
      --glass-bg: linear-gradient(135deg, rgba(255,235,210,.14), rgba(255,235,210,.04));
      --glass-strong: linear-gradient(135deg, rgba(255,235,210,.2), rgba(255,235,210,.07));
      --tile-bg: linear-gradient(160deg, rgba(255,235,210,.2), rgba(255,235,210,.05));
      --field-bg: rgba(255,235,210,.1);
      --rim-hi: rgba(255,240,220,.4);
      --rim-lo: rgba(255,240,220,.08);
      --shadow: rgba(0,0,0,.55);
      --btn-top: #F2DFC2;
      --btn-bottom: #D9BC96;
      --btn-ink: #2E1F14;
      --seg-active: rgba(255,235,210,.22);
      --heart: #E9836B;
      --danger: #F0907A;
      --focus: #8DB2FF;
      --blob1: #7A5030;
      --blob2: #5A3E28;
      --blob3: #6B4632;
      --blob4: #A06E43;
      --blob-opacity: .6;
      --backdrop: rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1D140E;
    --ink: #F5E8D5;
    --muted: #BFA88E;
    --glass-bg: linear-gradient(135deg, rgba(255,235,210,.14), rgba(255,235,210,.04));
    --glass-strong: linear-gradient(135deg, rgba(255,235,210,.2), rgba(255,235,210,.07));
    --tile-bg: linear-gradient(160deg, rgba(255,235,210,.2), rgba(255,235,210,.05));
    --field-bg: rgba(255,235,210,.1);
    --rim-hi: rgba(255,240,220,.4);
    --rim-lo: rgba(255,240,220,.08);
    --shadow: rgba(0,0,0,.55);
    --btn-top: #F2DFC2;
    --btn-bottom: #D9BC96;
    --btn-ink: #2E1F14;
    --seg-active: rgba(255,235,210,.22);
    --heart: #E9836B;
    --danger: #F0907A;
    --focus: #8DB2FF;
    --blob1: #7A5030;
    --blob2: #5A3E28;
    --blob3: #6B4632;
    --blob4: #A06E43;
    --blob-opacity: .6;
    --backdrop: rgba(0,0,0,.45);
  }

  *, *::before, *::after { box-sizing: inherit; }
  [hidden] { display: none !important; }
  html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 90px); scroll-behavior: smooth; }
  html.locked { overflow: hidden; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100%; }
  button, a, input, select, textarea { font: inherit; }
  button { cursor: pointer; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  h1, h2, h3, p { margin: 0; }

  /* Hintergrund */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: var(--blob-opacity); animation: drift 26s ease-in-out infinite alternate; }
  .b1 { width: 48vmax; height: 48vmax; background: var(--blob1); top: -14%; left: -12%; }
  .b2 { width: 42vmax; height: 42vmax; background: var(--blob2); top: 18%; right: -14%; animation-duration: 32s; animation-delay: -8s; }
  .b3 { width: 36vmax; height: 36vmax; background: var(--blob3); bottom: -14%; left: 22%; animation-duration: 29s; animation-delay: -14s; }
  .b4 { width: 26vmax; height: 26vmax; background: var(--blob4); bottom: 12%; right: 12%; animation-duration: 35s; animation-delay: -3s; }
  @keyframes drift { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(6vmax,-4vmax,0) scale(1.12); } }

  /* Liquid Glass */
  .glass {
    position: relative; isolation: isolate; border-radius: var(--r, 28px);
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
    box-shadow: inset 0 1px 1px var(--rim-hi), inset 0 -1px 1px var(--rim-lo), 0 22px 40px -20px var(--shadow);
  }
  dialog.glass { position: fixed; }
  .glass::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
    background: linear-gradient(140deg, rgba(255,255,255,.95), rgba(255,255,255,.04) 34%, rgba(255,255,255,.04) 66%, rgba(255,255,255,.7));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }
  .glass::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; pointer-events: none;
    background: radial-gradient(circle 240px at var(--mx, 50%) var(--my, 0%), rgba(255,255,255,.42), transparent 62%);
    opacity: 0; transition: opacity .3s ease;
  }
  .glass:hover::after { opacity: 1; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .glass::before { opacity: .45; } }
  :root[data-theme="dark"] .glass::before { opacity: .45; }

  /* Navigation */
  .nav {
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 20;
    max-width: 1120px; margin: 10px auto 0; width: calc(100% - 24px);
    --r: 999px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 8px 8px 22px;
  }
  .brand { font-family: var(--display); font-weight: 700; font-size: .95rem; letter-spacing: -.02em; text-decoration: none; color: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-actions { display: flex; align-items: center; gap: 8px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
    border: 0; border-radius: 999px; padding: 10px 20px; font-weight: 600; font-size: .95rem;
    background: linear-gradient(180deg, var(--btn-top), var(--btn-bottom)); color: var(--btn-ink);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -1px 0 rgba(0,0,0,.2), 0 10px 20px -10px rgba(59,42,29,.7);
    transition: transform .15s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.soft {
    background: rgba(255,255,255,.4); color: var(--ink);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.85), inset 0 -1px 1px rgba(255,255,255,.15), 0 6px 14px -8px var(--shadow);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.soft { background: rgba(255,235,210,.12); } }
  :root[data-theme="dark"] .btn.soft { background: rgba(255,235,210,.12); }
  .btn.danger { color: var(--danger); }
  .fav-count { display: inline-flex; align-items: center; gap: 6px; }

  /* Hero */
  .hero { max-width: 1120px; margin: 0 auto; padding: 48px 20px 28px; display: grid; grid-template-columns: 1.15fr 1fr; gap: 32px; align-items: center; }
  .hero h1 { font-family: var(--display); font-weight: 700; font-size: clamp(1.9rem, 4.4vw, 3.1rem); line-height: 1.12; letter-spacing: -.035em; max-width: 15ch; }
  .hero p.lead { color: var(--muted); font-size: 1.1rem; max-width: 46ch; margin: 18px 0 26px; }
  .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .code { --r: 999px; display: inline-flex; align-items: center; gap: 10px; padding: 5px 5px 5px 18px; }
  .code small { color: var(--muted); font-size: .85rem; }
  .code strong { font-family: var(--display); font-weight: 500; letter-spacing: .02em; font-size: .95rem; }
  .code .btn { padding: 7px 14px; font-size: .85rem; }

  .orb-stage { position: relative; width: min(400px, 82vw); aspect-ratio: 1; justify-self: center; }
  .orb {
    position: absolute; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 30% 22%, rgba(255,255,255,.85), rgba(255,255,255,.18) 34%, rgba(255,255,255,.04) 66%), var(--glass-strong);
    -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
    box-shadow: inset 0 2px 3px rgba(255,255,255,.9), inset 0 -14px 30px rgba(120,80,40,.22), inset 0 0 0 1px rgba(255,255,255,.3), 0 30px 50px -24px var(--shadow);
  }
  .orb.big { inset: 0; }
  .orb.big svg { width: 66%; }
  .orb.s1 { width: 34%; aspect-ratio: 1; right: -4%; top: 4%; }
  .orb.s2 { width: 28%; aspect-ratio: 1; left: -2%; bottom: 8%; }
  .orb.s1 svg, .orb.s2 svg { width: 62%; }
  .garment { display: block; filter: drop-shadow(0 10px 12px rgba(59,42,29,.32)); }

  /* Ablauf */
  .steps { max-width: 1120px; margin: 8px auto 0; width: calc(100% - 40px); --r: 26px; display: grid; grid-template-columns: repeat(3, 1fr); }
  .step { padding: 20px 24px; display: flex; gap: 14px; align-items: flex-start; }
  .step + .step { border-left: 1px solid rgba(255,255,255,.55); }
  .step b { font-family: var(--display); font-weight: 500; font-size: 1.5rem; line-height: 1; }
  .step span { color: var(--muted); font-size: .95rem; }
  .step strong { display: block; color: var(--ink); font-size: 1rem; margin-bottom: 2px; }

  /* Shop */
  .shop { max-width: 1120px; margin: 0 auto; padding: 44px 20px 24px; }
  .shop-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
  .shop-head h2 { font-family: var(--display); font-weight: 700; font-size: 1.6rem; letter-spacing: -.03em; }
  .seg { --r: 999px; display: inline-flex; gap: 2px; padding: 5px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button { border: 0; background: transparent; border-radius: 999px; padding: 8px 16px; font-weight: 500; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--seg-active); font-weight: 600; box-shadow: inset 0 1px 1px rgba(255,255,255,.9), 0 4px 10px -4px var(--shadow); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
  .card { padding: 10px; display: flex; flex-direction: column; gap: 12px; }
  .tile-wrap { position: relative; }
  .tile {
    display: grid; place-items: center; width: 100%; aspect-ratio: 1 / .88; border: 0; padding: 0; border-radius: 20px; overflow: hidden;
    background: var(--tile-bg); box-shadow: inset 0 1px 2px rgba(255,255,255,.85), inset 0 -10px 24px rgba(120,80,40,.12);
  }
  .tile .garment { width: 62%; transition: transform .25s ease; }
  .tile:hover .garment { transform: translateY(-3px) scale(1.04); }
  .tile .photo { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge { position: absolute; left: 10px; top: 10px; padding: 2px 11px; border-radius: 999px; font-size: .78rem; font-weight: 700; background: rgba(255,255,255,.75); color: #3B2A1D; box-shadow: inset 0 1px 1px #fff, 0 3px 8px -3px var(--shadow); }
  .heart { position: absolute; right: 10px; top: 10px; width: 38px; height: 38px; border-radius: 50%; border: 0; display: grid; place-items: center; background: rgba(255,255,255,.75); color: #3B2A1D; box-shadow: inset 0 1px 1px #fff, 0 3px 8px -3px var(--shadow); }
  .heart svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
  .heart[aria-pressed="true"] { color: #B5462F; }
  .heart[aria-pressed="true"] svg { fill: currentColor; }
  .info { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 0 8px; }
  .info h3 { font-size: 1.08rem; font-weight: 700; line-height: 1.25; }
  .cat { color: var(--muted); font-size: .9rem; }
  .price { font-family: var(--display); font-weight: 500; font-size: .95rem; white-space: nowrap; }
  .actions { display: flex; gap: 8px; padding: 0 4px 4px; }
  .actions .btn { flex: 1; padding: 10px 12px; }
  .empty { grid-column: 1 / -1; padding: 32px 4px; color: var(--muted); }

  footer { max-width: 1120px; margin: 24px auto 0; padding: 0 20px 40px; }
  .foot { --r: 24px; padding: 20px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 24px; color: var(--muted); font-size: .9rem; }
  .foot a { color: inherit; }

  /* Dialoge */
  dialog { color: var(--ink); border: 0; padding: 0; }
  dialog::backdrop { background: var(--backdrop); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  dialog.detail { --r: 32px; width: min(840px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow: auto; background: var(--glass-strong); }
  dialog.detail[open] { animation: pop .22s ease-out; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; }
  .detail-visual { padding: 14px; }
  .detail-visual .tile { aspect-ratio: auto; height: 100%; min-height: 300px; pointer-events: none; }
  .detail-visual .tile .garment { width: 70%; }
  .detail-text { padding: 30px 30px 30px 14px; display: flex; flex-direction: column; gap: 14px; }
  .detail-text h2 { font-family: var(--display); font-weight: 700; font-size: 1.6rem; letter-spacing: -.03em; line-height: 1.15; }
  .detail-text .price { font-size: 1.2rem; }
  .sizes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .sizes span.l { color: var(--muted); font-size: .9rem; margin-right: 4px; }
  .sizes span.s { min-width: 40px; text-align: center; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.5); font-weight: 600; font-size: .9rem; box-shadow: inset 0 1px 1px #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sizes span.s { background: rgba(255,235,210,.12); box-shadow: none; } }
  :root[data-theme="dark"] .sizes span.s { background: rgba(255,235,210,.12); box-shadow: none; }
  .detail-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: auto; padding-top: 6px; }
  .close, .x { width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.75); color: #3B2A1D; font-size: 1.05rem; box-shadow: inset 0 1px 1px #fff, 0 4px 10px -4px var(--shadow); }
  .close { position: absolute; top: 14px; right: 14px; z-index: 3; }

  /* Gate */
  .gate { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 20px; background: var(--backdrop); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); overflow: auto; }
  .gate-card { --r: 32px; width: min(460px, 100%); padding: 32px 28px 24px; display: flex; flex-direction: column; gap: 14px; background: var(--glass-strong); }
  .gate-card h2 { font-family: var(--display); font-weight: 700; font-size: 1.5rem; line-height: 1.15; letter-spacing: -.03em; }
  .gate-card p { color: var(--muted); }
  .gate-card .code { align-self: flex-start; }
  .linklike { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 6px; align-self: center; }

  /* Admin */
  .admin-fab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 30; }
  dialog.admin { --r: 30px; width: min(780px, calc(100% - 24px)); height: min(820px, calc(100% - 24px)); background: var(--glass-strong); overflow: hidden; }
  dialog.admin[open] { display: flex; flex-direction: column; animation: pop .22s ease-out; }
  .admin-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px 10px; }
  .admin-head h2 { font-family: var(--display); font-weight: 700; font-size: 1.15rem; letter-spacing: -.02em; }
  .admin-body { flex: 1; overflow: auto; padding: 6px 22px 16px; }
  .admin-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 22px calc(16px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid rgba(255,255,255,.55); }
  .admin-foot span { color: var(--muted); font-size: .9rem; }
  .tabs { margin: 8px 0 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field > label { font-weight: 600; font-size: .9rem; }
  .field input:not([type=checkbox]):not([type=color]):not([type=file]), .field select, .field textarea {
    background: var(--field-bg); border: 1px solid rgba(255,255,255,.7); border-radius: 14px; padding: 10px 12px; color: var(--ink); width: 100%;
  }
  .field input[type=color] { width: 64px; height: 42px; border: 1px solid rgba(255,255,255,.7); border-radius: 12px; padding: 3px; background: var(--field-bg); }
  .field textarea { min-height: 90px; resize: vertical; }
  .field small { color: var(--muted); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .check { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .check input { width: 20px; height: 20px; }
  .plist { list-style: none; margin: 14px 0 0; padding: 0; }
  .plist li { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.5); }
  .pthumb { width: 56px; height: 56px; border-radius: 14px; background: var(--tile-bg); display: grid; place-items: center; overflow: hidden; }
  .pthumb svg { width: 70%; }
  .pthumb img { width: 100%; height: 100%; object-fit: cover; }
  .pmeta { display: flex; flex-direction: column; min-width: 0; }
  .pmeta strong { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pmeta span { color: var(--muted); font-size: .9rem; }
  .pbtns { display: flex; gap: 6px; }
  .pbtns .btn { padding: 7px 12px; font-size: .85rem; }
  .photo-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .form-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 60; --r: 999px; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; padding: 10px 20px; font-weight: 600; transition: opacity .2s, transform .2s; background: var(--glass-strong); color: var(--ink); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; padding-top: 32px; }
    .orb-stage { width: min(300px, 74vw); order: -1; margin-bottom: 8px; }
    .steps { grid-template-columns: 1fr; }
    .step + .step { border-left: 0; border-top: 1px solid rgba(255,255,255,.55); }
  }
  @media (max-width: 640px) {
    .detail-grid { grid-template-columns: 1fr; }
    .detail-visual .tile { min-height: 220px; }
    .detail-text { padding: 6px 22px 24px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card { padding: 8px; }
    .info { flex-direction: column; gap: 2px; }
    .actions .btn.soft { display: none; }
    .brand { font-size: .82rem; }
    .two { grid-template-columns: 1fr; }
    .plist li { grid-template-columns: 56px 1fr; }
    .pbtns { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<template id="body-tpl">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
        <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".2"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  </div>

    var cats = ["Alle"].concat(categories(), ["Merkliste"]);

      return '<button type="button" data-cat="' + esc(c) + '" aria-pressed="' + (c === state.cat) + '">' + esc(c) + '</button>';

    var p = byId(id);

    $("detail").showModal();
  }
  function syncDetailFav() {
    if (!current) return;
    var on = favs.indexOf(current.id) >= 0;
    $("dFav").setAttribute("aria-pressed", on);
    $("dFav").textContent = on ? "Gemerkt" : "Merken";
  }
  var toastTimer;
  function toast(msg) {
    var t = $("toast");

    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }
  function toggleFav(id) {
    id = Number(id);
    var i = favs.indexOf(id);
    if (i >= 0) favs.splice(i, 1); else { favs.push(id); toast("Gemerkt"); }

    renderFavCount(); renderGrid(); syncDetailFav();
  }

  /* ---------- Registrierungs-Gate ---------- */
  function initGate() {
    var unlocked = false;
    try { unlocked = localStorage.getItem("unlocked") === "1"; } catch (e) {}

    $("gate").hidden = !show;
    document.documentElement.classList.toggle("locked", show);
  }
  $("gateReg").addEventListener("click", function () {
    $("gateGo").disabled = false;
  });
  function unlock() {
    try { localStorage.setItem("unlocked", "1"); } catch (e) {}
    initGate();
    window.scrollTo(0, 0);
  }

  $("gateSkip").addEventListener("click", unlock);

    $("shop").scrollIntoView({ behavior: "smooth" });

      '<div class="two">' +
        field("Kategorie", '<input type="text" data-f="category" list="catlist" value="' + esc(p.category) + '" placeholder="z. B. Hoodies"><datalist id="catlist">' + cats.map(function (c) { return '<option value="' + esc(c) + '">'; }).join("") + '</datalist>') +
        field("Preis", '<input type="number" data-f="price" min="0" step="0.5" value="' + esc(p.price) + '">') +
      '</div>' +
      field("Pikobuy-Link zu diesem Artikel", '<input type="url" data-f="link" value="' + esc(p.link) + '" placeholder="https://…"><small>Hier klicken Besucher hin. Leer lassen = dein Registrierungs-Link.</small>') +
      field("Größen (mit Komma trennen)", '<input type="text" data-f="sizes" value="' + esc((p.sizes || []).join(", ")) + '" placeholder="S, M, L, XL">') +
      field("Beschreibung", '<textarea data-f="description">' + esc(p.description) + '</textarea>') +
      '<div class="field"><label>Foto</label><div class="photo-row"><div class="pthumb">' + visual(p) + '</div>' +
        '<input type="file" accept="image/*" data-f="photo">' +
        (p.image ? '<button class="btn soft" type="button" data-a="rmphoto">Foto entfernen</button>' : '') + '</div>' +
        '<small>Ohne Foto zeigt die Seite eine gezeichnete Silhouette.</small></div>' +
      '<div class="two">' +
        field("Silhouette (ohne Foto)", '<select data-f="shape">' + Object.keys(SHAPE_NAMES).map(function (k) { return '<option value="' + k + '"' + (p.shape === k ? " selected" : "") + '>' + SHAPE_NAMES[k] + '</option>'; }).join("") + '</select>') +
        field("Farbe (ohne Foto)", '<input type="color" data-f="color" value="' + esc(p.color || "#C49A6C") + '">') +
      '</div>' +
      field("Label (optional)", '<input type="text" data-f="badge" value="' + esc(p.badge) + '" placeholder="Neu, Beliebt …">') +
      '<div class="form-actions"><button class="btn" type="button" data-a="apply">Übernehmen</button><button class="btn soft" type="button" data-a="cancel">Abbrechen</button></div>';
  }

  function fileToDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onerror = reject;
      fr.onload = function () {
        var img = new Image();
        img.onerror = reject;
        img.onload = function () {
          var max = 640, s = Math.min(1, max / Math.max(img.width, img.height));
          var c = document.createElement("canvas");
          c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL("image/jpeg", 0.8));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  /* Admin: Klicks */
  $("adminBody").addEventListener("click", function (e) {
    var t = e.target.closest("[data-tab]");
    if (t) { admin.tab = t.dataset.tab; admin.delArm = null; renderAdmin(); return; }
    var a = e.target.closest("[data-a]");
    if (!a) return;
    var act = a.dataset.a, id = Number(a.dataset.id);
    if (act === "new") {
      admin.editing = { id: null, name: "", category: "", price: 0, shape: "tee", color: "#C49A6C", badge: "", sizes: [], link: "", image: "", description: "" };
      admin.isNew = true; renderAdmin();
    } else if (act === "edit") {
      var p = byId(id);
      admin.editing = JSON.parse(JSON.stringify(p)); admin.isNew = false; renderAdmin();
    } else if (act === "del") {
      if (admin.delArm === id) {
        data.products = data.products.filter(function (x) { return x.id !== id; });
        admin.delArm = null; markDirty(); renderAll(); renderAdmin();
      } else { admin.delArm = id; renderAdmin(); }
    } else if (act === "rmphoto") {
      admin.editing.image = ""; renderAdmin();
    } else if (act === "cancel") {
      admin.editing = null; renderAdmin();
    } else if (act === "apply") {
      var d = admin.editing;
      if (!d.name.trim()) { setMsg("Bitte gib einen Namen ein."); return; }
      d.name = d.name.trim(); d.category = (d.category || "Sonstiges").trim() || "Sonstiges";
      d.price = Math.max(0, Number(d.price) || 0);
      if (admin.isNew) {
        d.id = data.products.reduce(function (m, x) { return Math.max(m, x.id); }, 0) + 1;
        data.products.unshift(d);
      } else {
        data.products = data.products.map(function (x) { return x.id === d.id ? d : x; });
      }
      admin.editing = null; markDirty(); renderAll(); renderAdmin();
    }
  });

  /* Admin: Eingaben */
  $("adminBody").addEventListener("input", function (e) {
    var el = e.target;
    if (el.dataset.k) {
      var v = el.type === "checkbox" ? el.checked : el.value;
      data.shop[el.dataset.k] = v;
      markDirty(); applyShop(); renderGrid();
      if (el.dataset.k === "gate") initGate();
    } else if (el.dataset.f && admin.editing && el.dataset.f !== "photo") {
      var f = el.dataset.f;
      if (f === "sizes") admin.editing.sizes = el.value.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
      else if (f === "price") admin.editing.price = el.value;
      else admin.editing[f] = el.value;
    }
  });
  $("adminBody").addEventListener("change", function (e) {
    var el = e.target;
    if (el.dataset.k === "currency" || el.dataset.k === "gate") { renderAll(); renderAdmin(); }
    if (el.dataset.f === "photo" && el.files && el.files[0]) {
      setMsg("Foto wird verkleinert …");
      fileToDataUrl(el.files[0]).then(function (url) {
        admin.editing.image = url; setMsg(dirty ? "Nicht veröffentlichte Änderungen." : "Alles gespeichert."); renderAdmin();
      }, function () { setMsg("Das Foto konnte nicht gelesen werden."); });
    }
    if (el.dataset.f === "shape" || el.dataset.f === "color") renderAdmin();
  });

  $("adminFab").addEventListener("click", function () { admin.editing = null; renderAdmin(); $("admin").showModal(); });
  $("adminClose").addEventListener("click", function () { $("admin").close(); });

  /* Speichern: erzeugt die komplette Seite neu und veröffentlicht sie */
  var HEAD = '<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">' +
    '<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Ctext y=\'.9em\' font-size=\'90\'%3E🤎%3C/text%3E%3C/svg%3E">' +
    '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
    '<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">';

  function buildHtml() {
    var css = $("css").textContent;
    var app = $("app").textContent;
    if (app.indexOf("function buildHtml") < 0 || !css) throw new Error("source");
    var json = JSON.stringify(data, null, 1).replace(/</g, "\\u003c");
    return "<!DOCTYPE html>\n<html lang=\"de\"><head>" + HEAD + "<title>" + esc(data.shop.name) + " × Pikobuy</title>" +
      "<style id=\"css\">" + css + "</style></head><body>" +
      "<template id=\"body-tpl\">" + tpl.innerHTML + "</template>\n" +
      "<script type=\"application/json\" id=\"data\">\n" + json + "\n<\/script>\n" +
      "<script id=\"app\">" + app + "<\/script>\n</body></html>";
  }

  $("adminSave").addEventListener("click", function () {
    if (!artifactApi) { setMsg("Speichern geht hier nicht. Öffne die Seite in Claude."); return; }
    var html;
    try { html = buildHtml(); } catch (err) { setMsg("Die Seite konnte nicht zusammengebaut werden."); return; }
    $("adminSave").disabled = true;
    setMsg("Wird veröffentlicht …");
    artifactApi.publish(html).then(function () {
      dirty = false; setMsg("Veröffentlicht. Die Seite lädt neu …");
    }, function (err) {
      $("adminSave").disabled = false;
      var c = err && err.code;
      if (c === "conflict") setMsg("Es gab eine neuere Version. Die Seite lädt neu.");
      else if (c === "not_writer" || c === "not_granted" || c === "consent_required") setMsg("Nur der Besitzer kann speichern.");
      else if (c === "too_large") setMsg("Die Seite ist zu groß. Nimm weniger oder kleinere Fotos.");
      else if (c === "rate_limited") setMsg("Zu schnell. Warte kurz und versuche es nochmal.");
      else setMsg("Speichern hat nicht geklappt. Versuche es nochmal.");
    });
  });

  /* Admin-Erkennung (leise im Hintergrund) */
  try {
    if (window.claude && window.claude.use) {
      Promise.all([window.claude.use("user"), window.claude.use("artifact")]).then(function (r) {
        var user = r[0], art = r[1];
        if (!user || !art) return;
        return user.canEdit().then(function (ok) {
          if (!ok) return;
          isAdmin = true; artifactApi = art;
          $("adminFab").hidden = false;
          initGate();
        });
      }).catch(function () {});
    }
  } catch (e) {}

  window.addEventListener("beforeunload", function (e) { if (dirty && isAdmin) { e.preventDefault(); e.returnValue = ""; } });

  renderAll();
  initGate();
})();
<\/script>
</body>
</html>
